<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Measurement Tool</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Make sure the canvas takes up the full screen */
        canvas { display: block; width: 100vw; height: 100vh; }
        /* AR Button positioning fix */
        #ARButton { bottom: 20px !important; z-index: 50 !important; }
    </style>
    
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- DOM Overlay for WebXR: This UI floats on top of the camera feed -->
    <div id="overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10 hidden">
        
        <!-- Header & Instructions -->
        <div class="bg-black/60 backdrop-blur-md text-white p-4 rounded-2xl shadow-lg border border-white/20 pointer-events-auto">
            <h1 class="text-xl font-bold mb-1">AR Measure PRO</h1>
            <p id="instructions" class="text-sm text-gray-200 mb-2">Move phone slowly to scan surfaces...</p>
            
            <!-- Live Distance to Camera -->
            <div id="live-dist-container" class="text-xs bg-blue-900/50 border border-blue-400/30 p-2 rounded-lg hidden transition-opacity">
                Camera to point: <span id="live-dist" class="font-mono font-bold text-blue-200">0.00 cm</span>
            </div>
        </div>

        <!-- Measurement Results Panel -->
        <div id="results" class="bg-black/80 backdrop-blur-md text-white p-5 rounded-2xl shadow-2xl border border-blue-500/50 mb-16 hidden pointer-events-auto transform transition-all">
            <div class="mb-4">
                <span class="text-xs text-blue-300 uppercase font-semibold tracking-wider">Total Distance</span>
                <div id="dist-total" class="text-3xl font-bold text-green-400">0.00 cm</div>
            </div>
            
            <div class="grid grid-cols-1 gap-2 text-sm text-gray-300 bg-white/5 p-3 rounded-xl border border-white/10 font-medium">
                <div id="dist-x" class="flex justify-between text-red-400"><span>X (Left/Right):</span> <span>0.00 cm</span></div>
                <div id="dist-y" class="flex justify-between text-green-400"><span>Y (Up/Down):</span> <span>0.00 cm</span></div>
                <div id="dist-z" class="flex justify-between text-blue-400"><span>Z (Depth):</span> <span>0.00 cm</span></div>
            </div>

            <button id="reset-btn" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                Clear & Restart
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Measurement State
        let points = [];
        let meshes = [];
        let measurementGroup = new THREE.Group();

        // Visualization Maps for World Mesh/Planes
        const planeMeshes = new Map();
        const worldMeshes = new Map();
        
        // Materials for environment visualization
        // Changed planes to a subtle solid surface, and made meshes highly visible
        const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
        const meshMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.8, side: THREE.DoubleSide });

        const uiOverlay = document.getElementById('overlay');
        const instructionsText = document.getElementById('instructions');
        const resultsPanel = document.getElementById('results');
        const liveDistContainer = document.getElementById('live-dist-container');
        const liveDistText = document.getElementById('live-dist');

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Request advanced environmental understanding features
            const arOptions = { 
                requiredFeatures: ['hit-test'], 
                optionalFeatures: ['dom-overlay', 'plane-detection', 'mesh-detection', 'depth-sensing'], 
                domOverlay: { root: uiOverlay },
                depthSensing: {
                    usagePreference: ['cpu-optimized', 'gpu-optimized'],
                    dataFormatPreference: ['luminance-alpha', 'float32']
                }
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);
            scene.add(measurementGroup);

            // Reticle
            const reticleGeometry = new THREE.SphereGeometry(0.015, 32, 32);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff, opacity: 0.8, transparent: true });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // UI Listeners
            document.getElementById('reset-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                resetMeasurement();
            });

            window.addEventListener('resize', onWindowResize);

            renderer.xr.addEventListener('sessionstart', () => {
                uiOverlay.classList.remove('hidden');
                resetMeasurement();
            });
            
            renderer.xr.addEventListener('sessionend', () => {
                uiOverlay.classList.add('hidden');
                hitTestSourceRequested = false;
                hitTestSource = null;
                clearEnvironmentMeshes();
            });
        }

        function onSelect() {
            if (reticle.visible) {
                if (points.length >= 2) {
                    resetMeasurement();
                    return;
                }

                const geometry = new THREE.SphereGeometry(0.015, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.setFromMatrixPosition(reticle.matrix);
                scene.add(sphere);
                
                meshes.push(sphere);
                points.push(sphere.position.clone());

                if (points.length === 1) {
                    instructionsText.innerText = "Point 1 saved. Move and tap to place Point 2.";
                    setReticleColor(0xffaa00);
                } else if (points.length === 2) {
                    instructionsText.innerText = "Measurement complete. Tap anywhere to reset.";
                    setReticleColor(0xff0000);
                    drawMeasurementLines(points[0], points[1]);
                    calculateAndDisplay(points[0], points[1]);
                    liveDistContainer.classList.add('hidden'); // Hide live dist when done
                }
            }
        }

        function setReticleColor(hex) {
            reticle.material.color.setHex(hex);
        }

        function drawMeasurementLines(p1, p2) {
            const geoMain = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const matMain = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
            measurementGroup.add(new THREE.Line(geoMain, matMain));

            const px = new THREE.Vector3(p2.x, p1.y, p1.z);
            const pxy = new THREE.Vector3(p2.x, p2.y, p1.z);

            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, px]), new THREE.LineBasicMaterial({ color: 0xff4444 })));
            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([px, pxy]), new THREE.LineBasicMaterial({ color: 0x44ff44 })));
            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pxy, p2]), new THREE.LineBasicMaterial({ color: 0x4444ff })));
        }

        function formatDistance(meters) {
            const cm = (meters * 100).toFixed(1);
            const inches = (meters * 39.3701).toFixed(1);
            return `${cm} cm / ${inches}"`;
        }

        function calculateAndDisplay(p1, p2) {
            const dx = Math.abs(p2.x - p1.x);
            const dy = Math.abs(p2.y - p1.y);
            const dz = Math.abs(p2.z - p1.z);
            const totalDist = p1.distanceTo(p2);

            document.getElementById('dist-total').innerText = formatDistance(totalDist);
            document.getElementById('dist-x').innerHTML = `<span>X (Left/Right):</span> <span class="font-mono">${formatDistance(dx)}</span>`;
            document.getElementById('dist-y').innerHTML = `<span>Y (Up/Down):</span> <span class="font-mono">${formatDistance(dy)}</span>`;
            document.getElementById('dist-z').innerHTML = `<span>Z (Depth):</span> <span class="font-mono">${formatDistance(dz)}</span>`;
            
            resultsPanel.classList.remove('hidden');
        }

        function resetMeasurement() {
            points = [];
            meshes.forEach(m => scene.remove(m));
            meshes = [];
            while(measurementGroup.children.length > 0){ 
                measurementGroup.remove(measurementGroup.children[0]); 
            }
            instructionsText.innerText = "Aim the reticle at a surface and tap the screen.";
            resultsPanel.classList.add('hidden');
            liveDistContainer.classList.add('hidden');
            setReticleColor(0x00aaff);
        }

        function clearEnvironmentMeshes() {
            planeMeshes.forEach(mesh => scene.remove(mesh));
            planeMeshes.clear();
            worldMeshes.forEach(mesh => scene.remove(mesh));
            worldMeshes.clear();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateEnvironmentVisualization(frame, referenceSpace) {
            // Visualize Planes as solid, subtle green surfaces
            if (frame.detectedPlanes) {
                frame.detectedPlanes.forEach(plane => {
                    let planeMesh = planeMeshes.get(plane);
                    if (!planeMesh) {
                        const geometry = new THREE.BufferGeometry();
                        planeMesh = new THREE.Mesh(geometry, planeMaterial);
                        scene.add(planeMesh);
                        planeMeshes.set(plane, planeMesh);
                    }
                    const pose = frame.getPose(plane.planeSpace, referenceSpace);
                    if (pose) {
                        planeMesh.matrix.fromArray(pose.transform.matrix);
                        planeMesh.matrixAutoUpdate = false;
                        
                        // Triangulate the plane polygon into a solid shape
                        const vertices = [];
                        const center = { x: 0, y: 0, z: 0 };
                        if (plane.polygon.length > 0) {
                            plane.polygon.forEach(p => { center.x += p.x; center.y += p.y; center.z += p.z; });
                            center.x /= plane.polygon.length; center.y /= plane.polygon.length; center.z /= plane.polygon.length;
                            
                            for (let i = 0; i < plane.polygon.length; i++) {
                                const p1 = plane.polygon[i];
                                const p2 = plane.polygon[(i + 1) % plane.polygon.length];
                                vertices.push(center.x, center.y, center.z);
                                vertices.push(p1.x, p1.y, p1.z);
                                vertices.push(p2.x, p2.y, p2.z);
                            }
                            planeMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                        }
                    }
                });
                for (const [plane, mesh] of planeMeshes) {
                    if (!frame.detectedPlanes.has(plane)) {
                        scene.remove(mesh);
                        planeMeshes.delete(plane);
                    }
                }
            }

            // Visualize raw 3D Meshes (if supported by device)
            if (frame.detectedMeshes) {
                frame.detectedMeshes.forEach(mesh => {
                    let threeMesh = worldMeshes.get(mesh);
                    if (!threeMesh) {
                        const geometry = new THREE.BufferGeometry();
                        threeMesh = new THREE.Mesh(geometry, meshMaterial);
                        scene.add(threeMesh);
                        worldMeshes.set(mesh, threeMesh);
                    }
                    const pose = frame.getPose(mesh.meshSpace, referenceSpace);
                    if (pose) {
                        threeMesh.matrix.fromArray(pose.transform.matrix);
                        threeMesh.matrixAutoUpdate = false;
                        threeMesh.geometry.setAttribute('position', new THREE.BufferAttribute(mesh.vertices, 3));
                        threeMesh.geometry.setIndex(new THREE.BufferAttribute(mesh.indices, 1));
                    }
                });
                for (const [mesh, threeMesh] of worldMeshes) {
                    if (!frame.detectedMeshes.has(mesh)) {
                        scene.remove(threeMesh);
                        worldMeshes.delete(mesh);
                    }
                }
            }
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Update the transparent world meshes
                updateEnvironmentVisualization(frame, referenceSpace);

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        // CRITICAL FIX: Add entityTypes to force hitting raw TOF points (bumps) and meshes, not just planes
                        session.requestHitTestSource({ 
                            space: viewerSpace,
                            entityTypes: ['point', 'mesh', 'plane'] 
                        }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        // Calculate Live Distance to Camera
                        if (points.length < 2) {
                            const cameraPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
                            const reticlePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                            const distToCamera = cameraPos.distanceTo(reticlePos);
                            
                            liveDistText.innerText = formatDistance(distToCamera);
                            liveDistContainer.classList.remove('hidden');
                        }
                        
                        if (points.length === 0) {
                            instructionsText.innerText = "Surface/Object detected! Tap to place point 1.";
                        }
                    } else {
                        reticle.visible = false;
                        liveDistContainer.classList.add('hidden');
                        if (points.length === 0) {
                            instructionsText.innerText = "Looking for surfaces. Move your phone slowly...";
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
