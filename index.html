<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Measurement Tool</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Make sure the canvas takes up the full screen */
        canvas { display: block; width: 100vw; height: 100vh; }
        /* AR Button positioning fix */
        #ARButton { bottom: 20px !important; z-index: 50 !important; }
    </style>
    
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- DOM Overlay for WebXR: This UI floats on top of the camera feed -->
    <div id="overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10 hidden">
        
        <!-- Header & Instructions -->
        <div class="bg-black/60 backdrop-blur-md text-white p-4 rounded-2xl shadow-lg border border-white/20 pointer-events-auto">
            <div class="flex justify-between items-start mb-1">
                <h1 class="text-xl font-bold">AR Measure PRO</h1>
                <!-- Hardware capability indicator -->
                <span id="sensor-status" class="text-[10px] px-2 py-1 bg-yellow-500/20 text-yellow-300 border border-yellow-500/50 rounded-full font-semibold">
                    Initializing...
                </span>
            </div>
            <p id="instructions" class="text-sm text-gray-200 mb-2">Aim center of screen at any object...</p>
            
            <!-- Live Distance to Camera -->
            <div id="live-dist-container" class="text-xs bg-blue-900/50 border border-blue-400/30 p-2 rounded-lg hidden transition-opacity">
                Camera to object: <span id="live-dist" class="font-mono font-bold text-blue-200">0.00 cm</span>
            </div>
        </div>

        <!-- Measurement Results Panel -->
        <div id="results" class="bg-black/80 backdrop-blur-md text-white p-5 rounded-2xl shadow-2xl border border-blue-500/50 mb-16 hidden pointer-events-auto transform transition-all">
            <div class="mb-4">
                <span class="text-xs text-blue-300 uppercase font-semibold tracking-wider">Total Distance</span>
                <div id="dist-total" class="text-3xl font-bold text-green-400">0.00 cm</div>
            </div>
            
            <div class="grid grid-cols-1 gap-2 text-sm text-gray-300 bg-white/5 p-3 rounded-xl border border-white/10 font-medium">
                <div id="dist-x" class="flex justify-between text-red-400"><span>X (Left/Right):</span> <span>0.00 cm</span></div>
                <div id="dist-y" class="flex justify-between text-green-400"><span>Y (Up/Down):</span> <span>0.00 cm</span></div>
                <div id="dist-z" class="flex justify-between text-blue-400"><span>Z (Depth):</span> <span>0.00 cm</span></div>
            </div>

            <button id="reset-btn" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                Clear & Restart
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let depthApiActive = false;

        // Measurement State
        let points = [];
        let meshes = [];
        let measurementGroup = new THREE.Group();

        const uiOverlay = document.getElementById('overlay');
        const instructionsText = document.getElementById('instructions');
        const resultsPanel = document.getElementById('results');
        const liveDistContainer = document.getElementById('live-dist-container');
        const liveDistText = document.getElementById('live-dist');
        const sensorStatus = document.getElementById('sensor-status');

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Request Depth Sensing API explicitly
            const arOptions = { 
                requiredFeatures: ['hit-test'], 
                optionalFeatures: ['dom-overlay', 'depth-sensing'], 
                domOverlay: { root: uiOverlay },
                depthSensing: {
                    usagePreference: ['cpu-optimized', 'gpu-optimized'],
                    dataFormatPreference: ['luminance-alpha', 'float32']
                }
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);
            scene.add(measurementGroup);

            // Reticle (Ball) - matrixAutoUpdate is TRUE so we can manually set position
            const reticleGeometry = new THREE.SphereGeometry(0.015, 32, 32);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff, opacity: 0.8, transparent: true });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = true; 
            reticle.visible = false;
            scene.add(reticle);

            // UI Listeners
            document.getElementById('reset-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                resetMeasurement();
            });

            window.addEventListener('resize', onWindowResize);

            renderer.xr.addEventListener('sessionstart', () => {
                uiOverlay.classList.remove('hidden');
                sensorStatus.className = "text-[10px] px-2 py-1 bg-yellow-500/20 text-yellow-300 border border-yellow-500/50 rounded-full font-semibold";
                sensorStatus.innerText = "Hit-Test Fallback";
                resetMeasurement();
            });
            
            renderer.xr.addEventListener('sessionend', () => {
                uiOverlay.classList.add('hidden');
                hitTestSourceRequested = false;
                hitTestSource = null;
                depthApiActive = false;
            });
        }

        function onSelect() {
            if (reticle.visible) {
                if (points.length >= 2) {
                    resetMeasurement();
                    return;
                }

                const geometry = new THREE.SphereGeometry(0.015, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.copy(reticle.position);
                scene.add(sphere);
                
                meshes.push(sphere);
                points.push(sphere.position.clone());

                if (points.length === 1) {
                    instructionsText.innerText = "Point 1 saved. Aim and tap to place Point 2.";
                    setReticleColor(0xffaa00);
                } else if (points.length === 2) {
                    instructionsText.innerText = "Measurement complete. Tap anywhere to reset.";
                    setReticleColor(0xff0000);
                    drawMeasurementLines(points[0], points[1]);
                    calculateAndDisplay(points[0], points[1]);
                    liveDistContainer.classList.add('hidden'); // Hide live dist when done
                }
            }
        }

        function setReticleColor(hex) {
            reticle.material.color.setHex(hex);
        }

        function drawMeasurementLines(p1, p2) {
            const geoMain = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const matMain = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
            measurementGroup.add(new THREE.Line(geoMain, matMain));

            const px = new THREE.Vector3(p2.x, p1.y, p1.z);
            const pxy = new THREE.Vector3(p2.x, p2.y, p1.z);

            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, px]), new THREE.LineBasicMaterial({ color: 0xff4444 })));
            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([px, pxy]), new THREE.LineBasicMaterial({ color: 0x44ff44 })));
            measurementGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pxy, p2]), new THREE.LineBasicMaterial({ color: 0x4444ff })));
        }

        function formatDistance(meters) {
            const cm = (meters * 100).toFixed(1);
            const inches = (meters * 39.3701).toFixed(1);
            return `${cm} cm / ${inches}"`;
        }

        function calculateAndDisplay(p1, p2) {
            const dx = Math.abs(p2.x - p1.x);
            const dy = Math.abs(p2.y - p1.y);
            const dz = Math.abs(p2.z - p1.z);
            const totalDist = p1.distanceTo(p2);

            document.getElementById('dist-total').innerText = formatDistance(totalDist);
            document.getElementById('dist-x').innerHTML = `<span>X (Left/Right):</span> <span class="font-mono">${formatDistance(dx)}</span>`;
            document.getElementById('dist-y').innerHTML = `<span>Y (Up/Down):</span> <span class="font-mono">${formatDistance(dy)}</span>`;
            document.getElementById('dist-z').innerHTML = `<span>Z (Depth):</span> <span class="font-mono">${formatDistance(dz)}</span>`;
            
            resultsPanel.classList.remove('hidden');
        }

        function resetMeasurement() {
            points = [];
            meshes.forEach(m => scene.remove(m));
            meshes = [];
            while(measurementGroup.children.length > 0){ 
                measurementGroup.remove(measurementGroup.children[0]); 
            }
            instructionsText.innerText = "Aim the center of screen at an object and tap.";
            resultsPanel.classList.add('hidden');
            liveDistContainer.classList.add('hidden');
            setReticleColor(0x00aaff);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Setup fallback hit-test source
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                let hasValidPlacement = false;
                let distanceToPoint = 0;

                // METHOD 1: Try reading RAW Depth Buffer (Highest Precision for objects/verticals)
                const viewerPose = frame.getViewerPose(referenceSpace);
                if (viewerPose && viewerPose.views.length > 0) {
                    try {
                        const view = viewerPose.views[0];
                        const depthInfo = frame.getDepthInformation(view);
                        
                        if (depthInfo) {
                            // Get distance to the exact center pixel of the screen
                            const depth = depthInfo.getDepthInMeters(0.5, 0.5);
                            
                            if (depth > 0.01 && depth < 20) { // Valid data check
                                if (!depthApiActive) {
                                    depthApiActive = true;
                                    sensorStatus.className = "text-[10px] px-2 py-1 bg-green-500/20 text-green-300 border border-green-500/50 rounded-full font-semibold";
                                    sensorStatus.innerText = "TOF Sensor Active";
                                }

                                // Project a point straight forward from the camera
                                const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
                                const camRot = new THREE.Matrix4().extractRotation(camera.matrixWorld);
                                const camDir = new THREE.Vector3(0, 0, -1).applyMatrix4(camRot).normalize();
                                
                                reticle.position.copy(camPos).add(camDir.multiplyScalar(depth));
                                reticle.quaternion.copy(camera.quaternion); // Face camera
                                reticle.visible = true;
                                
                                hasValidPlacement = true;
                                distanceToPoint = depth;
                            }
                        }
                    } catch(e) {
                        // Depth reading failed this frame, ignore and fallback
                    }
                }

                // METHOD 2: Fallback to standard ARCore Hit-Test if depth map isn't available
                if (!hasValidPlacement && hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        // Extract position out of the matrix
                        reticle.matrix.fromArray(pose.transform.matrix);
                        reticle.matrix.decompose(reticle.position, reticle.quaternion, reticle.scale);
                        reticle.visible = true;
                        
                        hasValidPlacement = true;
                        const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
                        distanceToPoint = camPos.distanceTo(reticle.position);
                    }
                }

                // Update UI based on success
                if (hasValidPlacement) {
                    if (points.length < 2) {
                        liveDistText.innerText = formatDistance(distanceToPoint);
                        liveDistContainer.classList.remove('hidden');
                        if (points.length === 0) instructionsText.innerText = "Surface detected! Tap to place point 1.";
                    }
                } else {
                    reticle.visible = false;
                    liveDistContainer.classList.add('hidden');
                    if (points.length === 0) instructionsText.innerText = "Looking for depth data...";
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
