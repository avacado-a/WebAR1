<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Measurement Tool</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Make sure the canvas takes up the full screen */
        canvas { display: block; width: 100vw; height: 100vh; }
        /* AR Button positioning fix */
        #ARButton { bottom: 20px !important; }
    </style>
    
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- DOM Overlay for WebXR: This UI floats on top of the camera feed -->
    <div id="overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10 hidden">
        
        <!-- Header & Instructions -->
        <div class="bg-black/60 backdrop-blur-md text-white p-4 rounded-2xl shadow-lg border border-white/20 pointer-events-auto">
            <h1 class="text-xl font-bold mb-1">AR Measure</h1>
            <p id="instructions" class="text-sm text-gray-200">Move phone slowly to detect surfaces...</p>
        </div>

        <!-- Measurement Results Panel -->
        <div id="results" class="bg-black/80 backdrop-blur-md text-white p-5 rounded-2xl shadow-2xl border border-blue-500/50 mb-16 hidden pointer-events-auto transform transition-all">
            <div class="mb-4">
                <span class="text-xs text-blue-300 uppercase font-semibold tracking-wider">Total Distance</span>
                <div id="dist-total" class="text-3xl font-bold text-green-400">0.00 cm</div>
            </div>
            
            <div class="grid grid-cols-1 gap-2 text-sm text-gray-300 bg-white/5 p-3 rounded-xl border border-white/10 font-medium">
                <div id="dist-x" class="flex justify-between text-red-400"><span>X (Left/Right):</span> <span>0.00 cm</span></div>
                <div id="dist-y" class="flex justify-between text-green-400"><span>Y (Up/Down):</span> <span>0.00 cm</span></div>
                <div id="dist-z" class="flex justify-between text-blue-400"><span>Z (Depth):</span> <span>0.00 cm</span></div>
            </div>

            <button id="reset-btn" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                Clear & Restart
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Measurement State
        let points = [];
        let meshes = [];
        let measurementGroup = new THREE.Group(); // Group to hold all 3D lines

        const uiOverlay = document.getElementById('overlay');
        const instructionsText = document.getElementById('instructions');
        const resultsPanel = document.getElementById('results');

        init();
        animate();

        function init() {
            // Setup Scene
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Setup Lighting
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            scene.add(light);

            // Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Setup AR Button with WebXR DOM Overlay requirement
            const arOptions = { 
                requiredFeatures: ['hit-test'], 
                optionalFeatures: ['dom-overlay'], 
                domOverlay: { root: uiOverlay } 
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            // Setup AR Controller
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            scene.add(measurementGroup); // Add measurement lines group

            // Create Reticle (the target ball that snaps to surfaces)
            const reticleGeometry = new THREE.SphereGeometry(0.015, 32, 32);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff, opacity: 0.8, transparent: true });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Event Listeners for UI
            document.getElementById('reset-btn').addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent triggering the 3D select event
                resetMeasurement();
            });

            window.addEventListener('resize', onWindowResize);

            // WebXR Session Management
            renderer.xr.addEventListener('sessionstart', () => {
                uiOverlay.classList.remove('hidden');
                resetMeasurement();
            });
            renderer.xr.addEventListener('sessionend', () => {
                uiOverlay.classList.add('hidden');
                hitTestSourceRequested = false;
                hitTestSource = null;
            });
        }

        function onSelect() {
            if (reticle.visible) {
                // If we already have 2 points, clicking again resets everything
                if (points.length >= 2) {
                    resetMeasurement();
                    return;
                }

                // Create a small sphere at the reticle's exact current location
                const geometry = new THREE.SphereGeometry(0.015, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.setFromMatrixPosition(reticle.matrix);
                scene.add(sphere);
                
                meshes.push(sphere);
                points.push(sphere.position.clone());

                // Update UI state
                if (points.length === 1) {
                    instructionsText.innerText = "Point 1 saved. Move and tap to place Point 2.";
                    setReticleColor(0xffaa00); // Change reticle color
                } else if (points.length === 2) {
                    instructionsText.innerText = "Measurement complete. Tap anywhere to reset.";
                    setReticleColor(0xff0000); // Change reticle color
                    drawMeasurementLines(points[0], points[1]);
                    calculateAndDisplay(points[0], points[1]);
                }
            }
        }

        function setReticleColor(hex) {
            reticle.material.color.setHex(hex);
        }

        function drawMeasurementLines(p1, p2) {
            // Main direct line (White)
            const geoMain = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const matMain = new THREE.LineBasicMaterial({ color: 0xffffff });
            measurementGroup.add(new THREE.Line(geoMain, matMain));

            // Intermediate points for orthogonal path
            const px = new THREE.Vector3(p2.x, p1.y, p1.z);
            const pxy = new THREE.Vector3(p2.x, p2.y, p1.z);

            // X Line (Red)
            const geoX = new THREE.BufferGeometry().setFromPoints([p1, px]);
            const matX = new THREE.LineBasicMaterial({ color: 0xff4444 });
            measurementGroup.add(new THREE.Line(geoX, matX));

            // Y Line (Green)
            const geoY = new THREE.BufferGeometry().setFromPoints([px, pxy]);
            const matY = new THREE.LineBasicMaterial({ color: 0x44ff44 });
            measurementGroup.add(new THREE.Line(geoY, matY));

            // Z Line (Blue)
            const geoZ = new THREE.BufferGeometry().setFromPoints([pxy, p2]);
            const matZ = new THREE.LineBasicMaterial({ color: 0x4444ff });
            measurementGroup.add(new THREE.Line(geoZ, matZ));
        }

        function formatDistance(meters) {
            const cm = (meters * 100).toFixed(1);
            const inches = (meters * 39.3701).toFixed(1);
            return `${cm} cm / ${inches}"`;
        }

        function calculateAndDisplay(p1, p2) {
            // Calculate absolute differences across axes
            const dx = Math.abs(p2.x - p1.x);
            const dy = Math.abs(p2.y - p1.y); // Up/Down relative to start
            const dz = Math.abs(p2.z - p1.z); // Depth relative to start
            const totalDist = p1.distanceTo(p2); // True Euclidean distance

            // Update DOM
            document.getElementById('dist-total').innerText = formatDistance(totalDist);
            
            document.getElementById('dist-x').innerHTML = `<span>X (Left/Right):</span> <span class="font-mono">${formatDistance(dx)}</span>`;
            document.getElementById('dist-y').innerHTML = `<span>Y (Up/Down):</span> <span class="font-mono">${formatDistance(dy)}</span>`;
            document.getElementById('dist-z').innerHTML = `<span>Z (Depth):</span> <span class="font-mono">${formatDistance(dz)}</span>`;
            
            resultsPanel.classList.remove('hidden');
        }

        function resetMeasurement() {
            points = [];
            
            meshes.forEach(m => scene.remove(m));
            meshes = [];
            
            // Clear all drawn lines
            while(measurementGroup.children.length > 0){ 
                measurementGroup.remove(measurementGroup.children[0]); 
            }
            
            instructionsText.innerText = "Aim the reticle at a surface and tap the screen.";
            resultsPanel.classList.add('hidden');
            setReticleColor(0x00aaff); // Reset to blue
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Request Hit Test Source
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                // Process Hit Test
                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        if (points.length === 0) {
                            instructionsText.innerText = "Surface detected! Tap to place point 1.";
                        }
                    } else {
                        reticle.visible = false;
                        if (points.length === 0) {
                            instructionsText.innerText = "Looking for surfaces. Move your phone slowly...";
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
